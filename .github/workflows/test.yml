name: test

on: [pull_request]

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm ci
      - run: npm run test:ut
      - if: always()
        uses: davelosert/vitest-coverage-report-action@v2
  
  types:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm ci
      - run: npm run test:types

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm ci
      - run: npm run test:lint

  integrations-bun:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm run test:integrations:bun

  integrations-deno:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm run test:integrations:deno
